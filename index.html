<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport Slide Website</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="nav-dots">
        <div class="dot active" onclick="scrollToSlide(0)"></div>
        <div class="dot" onclick="scrollToSlide(1)"></div>
        <div class="dot" onclick="scrollToSlide(2)"></div>
        <div class="dot" onclick="scrollToSlide(3)"></div>
    </nav>

    <main class="slide-container">
        <section class="v-slide section-1">
            <div class="animate-target">
                <h1>01. WELCOME</h1>
                <p>뷰포트 슬라이드 웹사이트에 오신 것을 환영합니다.</p>
            </div>
        </section>
        
        <section class="v-slide section-2">
            <div class="animate-target">
                <h1>02. ABOUT</h1>
                <p>스크롤을 내리면 화면이 한 칸씩 딱 맞게 넘어갑니다.</p>
            </div>
        </section>
        
        <section class="v-slide section-3">
            <div class="animate-target">
                <h1>03. WORK</h1>
                <p>CSS의 scroll-snap 기능을 활용해 부드럽습니다.</p>
            </div>
        </section>
        
        <section class="v-slide section-4" id="gesture-zone">
            <div class="animate-target">
                <h1>04. CONTACT</h1>
                <p class="guide-text"><i class="fas fa-mobile-alt shake-icon"></i> 스마트폰을 가볍게 흔들거나 위로 밀어 올리세요!</p>
                
                <button id="sensor-btn" class="sensor-activate-btn" onclick="requestSensorPermission()">모바일 흔들기 기능 켜기</button>
            </div>

            <div class="samsung-card" id="my-card">
                <div class="card-chip"></div>
                <div class="card-info">
                    <span class="card-name">Jang Gyeong Jun</span>
                    <span class="card-id">s2433</span>
                </div>
                <div class="card-footer-links">
                    <a href="mailto:s2433@e-mirim.hs.kr" title="Email"><i class="fas fa-envelope"></i> Email</a>
                    <a href="https://github.com/jgj1020" target="_blank" title="GitHub"><i class="fab fa-github"></i> GitHub</a>
                    <a href="https://www.instagram.com/jgj1020" target="_blank" title="Instagram"><i class="fab fa-instagram"></i> Instagram</a>
                </div>
                <button class="close-card-btn" onclick="toggleCard(false)">이전으로</button>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
